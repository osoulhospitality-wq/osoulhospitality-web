name: Static Site Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.4'
      - name: Lint PHP files
        run: find . -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 -I{} php -l {}

      - name: Test request state and concurrent duplicate handling
        run: python3 scripts/test_lead_state.py

  business-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test synthetic business lifecycle
        run: |
          python3 automation/business-lifecycle/test_lifecycle.py
          python3 -m unittest discover -s automation/reconciliation -p 'test_*.py' -v

  internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify local href/src references resolve to real files
        run: python3 scripts/check-internal-links.py

  release-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify shipped files match .checksums.sha256
        run: sha256sum -c .checksums.sha256

  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run release-readiness assertions
        run: node scripts/check-release-readiness.mjs

  dragon-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Dragon workflow and acceptance policy
        run: node automation/tests/dragon-workflow.test.mjs
