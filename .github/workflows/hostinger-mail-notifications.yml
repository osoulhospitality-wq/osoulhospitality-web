name: Hostinger Mail Notifications

on:
  workflow_run:
    workflows: ["Static Site Checks"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check notification configuration
        id: notification-config
        env:
          HOSTINGER_SMTP_USERNAME: ${{ secrets.HOSTINGER_SMTP_USERNAME }}
          HOSTINGER_SMTP_PASSWORD: ${{ secrets.HOSTINGER_SMTP_PASSWORD }}
          OPS_NOTIFICATION_TO: ${{ vars.OPS_NOTIFICATION_TO }}
        run: |
          if [[ -n "$HOSTINGER_SMTP_USERNAME" && -n "$HOSTINGER_SMTP_PASSWORD" && -n "$OPS_NOTIFICATION_TO" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Send operational email through Hostinger SMTP
        id: smtp-notification
        if: steps.notification-config.outputs.ready == 'true'
        continue-on-error: true
        env:
          HOSTINGER_SMTP_USERNAME: ${{ secrets.HOSTINGER_SMTP_USERNAME }}
          HOSTINGER_SMTP_PASSWORD: ${{ secrets.HOSTINGER_SMTP_PASSWORD }}
          OPS_NOTIFICATION_TO: ${{ vars.OPS_NOTIFICATION_TO }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: python3 scripts/send_hostinger_notification.py
      - name: Open a GitHub incident when email is unavailable
        if: >-
          steps.notification-config.outputs.ready != 'true' ||
          steps.smtp-notification.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run || {};
            const runUrl = run.html_url || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions`;
            const runId = run.id || context.runId;
            const title = `[Ops] CI notification fallback — run ${runId}`;
            const reason = '${{ steps.notification-config.outputs.ready }}' === 'true'
              ? 'The SMTP notification step failed.'
              : 'SMTP notification secrets or recipient configuration are missing.';
            const body = [
              reason,
              '',
              `Workflow: ${run.name || 'manual dispatch'}`,
              `Conclusion: ${run.conclusion || 'manual check'}`,
              `Branch: ${run.head_branch || 'main'}`,
              `Run: ${runUrl}`,
              '',
              'Action required: review the failed run and restore the SMTP notification configuration.'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            if (!existing.data.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
