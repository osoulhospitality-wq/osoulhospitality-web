name: Public Riyadh Sales Intelligence Research

on:
  push:
    branches:
      - sales-intelligence-research-20260816
    paths:
      - 'scripts/sales_intel_scrape.py'
      - '.github/workflows/sales-intelligence-public-research.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  scrape-public-event-directories:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml playwright
          playwright install chromium --with-deps

      - name: Run public-directory research
        run: python scripts/sales_intel_scrape.py

      - name: Upload research dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riyadh-public-sales-research
          path: sales_intel_output/
          if-no-files-found: warn
          retention-days: 7
